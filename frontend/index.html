<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COCOARENA</title>
  <meta name="description" content="COCOARENA - Leading Coconut Merchant Platform.">
  
  <!-- Google Fonts: Cinzel & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Ramabhadra&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Scenic Konaseema Coconut Plantation Background -->
  <div class="scenic-backdrop" style="background-image: url('assets/images/konaseema_bg.jpg');"></div>
  <div class="scenic-light-overlay"></div>

  <!-- App Wrapper -->
  <div class="app-layout">
    
    <!-- TOP HEADER -->
    <header class="top-navbar" id="top-navbar">
      <div class="navbar-container">
        
        <!-- Company Name / Brand Title -->
        <div class="header-brand">
          <span class="brand-title" id="header-company-name">COCOARENA</span>
        </div>

        <!-- Right Side of Header: Language Switcher -->
        <div class="header-actions">
          
          <!-- Bilingual Language Switcher (Telugu / English) -->
          <div class="lang-switch-box">
            <button type="button" class="lang-btn active" id="btn-lang-en" data-lang="en">English</button>
            <span class="lang-divider">|</span>
            <button type="button" class="lang-btn" id="btn-lang-te" data-lang="te">తెలుగు</button>
          </div>

        </div>

      </div>
    </header>

    <!-- MAIN SECTION: CENTERED SIGN IN DIALOG -->
    <main class="hero-container hero-centered">
      
      <!-- SIGN IN CARD -->
      <section class="auth-card-container" id="auth-section">
        
        <div class="auth-card-header">
          <h3 class="auth-heading" id="text-login-heading">Sign In</h3>
        </div>

        <form id="login-form" class="auth-form" autocomplete="off">
          
          <!-- Username / Phone Number Box -->
          <div class="form-group">
            <label for="login-username" class="form-label" id="label-login-username">Username / Phone Number</label>
            <div class="input-container">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="login-username" 
                name="username" 
                class="form-input" 
                placeholder="Enter username or phone number" 
                required
              >
            </div>
          </div>

          <!-- Password Box -->
          <div class="form-group">
            <label for="login-password" class="form-label" id="label-login-password">Password</label>
            <div class="input-container">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                class="form-input" 
                placeholder="Enter password" 
                required
              >
              <button type="button" class="btn-toggle-password" id="btn-toggle-login-pass" aria-label="Toggle password">
                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Sign In Button -->
          <button type="submit" class="btn-auth-submit" id="btn-login-submit">
            <span class="btn-text" id="text-btn-login">SIGN IN</span>
          </button>

          <!-- Register Option Below Login Button (Redirects to register.html) -->
          <div class="auth-bottom-switch">
            <span id="text-no-account">Don't have an account?</span>
            <a href="register.html" class="switch-link-redirect" id="link-redirect-register">Register</a>
          </div>

        </form>

      </section>

    </main>

  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Shared Languages & App Logic -->
  <script src="api-config.js"></script>
  <script src="lang.js"></script>
  <script src="app.js"></script>
</body>
</html>
