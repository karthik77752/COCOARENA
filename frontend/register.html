<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | COCOARENA</title>
  <meta name="description" content="Register your account with COCOARENA - Leading Coconut Merchant Platform.">
  
  <!-- Google Fonts: Cinzel & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Ramabhadra&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Scenic Konaseema Coconut Plantation Background -->
  <div class="scenic-backdrop" style="background-image: url('assets/images/konaseema_bg.jpg');"></div>
  <div class="scenic-light-overlay"></div>

  <!-- App Layout -->
  <div class="app-layout">
    
    <!-- TOP HEADER -->
    <header class="top-navbar" id="top-navbar">
      <div class="navbar-container">
        
        <!-- Company Name / Brand Title -->
        <div class="header-brand">
          <a href="index.html" class="brand-link">
            <span class="brand-title" id="header-company-name">COCOARENA</span>
          </a>
        </div>

        <!-- Right: Language Switcher -->
        <div class="header-actions">
          
          <div class="lang-switch-box">
            <button type="button" class="lang-btn active" id="btn-lang-en" data-lang="en">English</button>
            <span class="lang-divider">|</span>
            <button type="button" class="lang-btn" id="btn-lang-te" data-lang="te">తెలుగు</button>
          </div>

        </div>

      </div>
    </header>

    <!-- MAIN HERO SECTION: CENTERED REGISTRATION DIALOG -->
    <main class="hero-container hero-centered">
      
      <!-- REGISTRATION CARD -->
      <section class="auth-card-container register-card-container" id="auth-section">
        
        <div class="auth-card-header">
          <h3 class="auth-heading" id="text-register-heading">Register Account</h3>
        </div>

        <form id="register-form" class="auth-form" autocomplete="off">
          
          <!-- Full Name -->
          <div class="form-group">
            <label for="reg-fullname" class="form-label" id="label-reg-fullname">Full Name / Trade Entity</label>
            <div class="input-container">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="reg-fullname" 
                name="fullname" 
                class="form-input" 
                placeholder="Enter your name or business name" 
                required
              >
            </div>
          </div>

          <!-- Phone Number & Username Row -->
          <div class="form-row">
            <div class="form-group flex-1">
              <label for="reg-phone" class="form-label" id="label-reg-phone">Phone Number (10 Digits)</label>
              <div class="input-container">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                  </svg>
                </span>
                <input 
                  type="tel" 
                  id="reg-phone" 
                  name="phone" 
                  class="form-input" 
                  placeholder="e.g. 9876543210" 
                  maxlength="10" 
                  pattern="[0-9]{10}"
                  required
                >
              </div>
            </div>
            <div class="form-group flex-1">
              <label for="reg-username" class="form-label" id="label-reg-username">Username</label>
              <div class="input-container">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </span>
                <input 
                  type="text" 
                  id="reg-username" 
                  name="username" 
                  class="form-input" 
                  placeholder="Choose username" 
                  minlength="3"
                  required
                >
              </div>
            </div>
          </div>

          <!-- Password & Confirm Password Row -->
          <div class="form-row">
            <div class="form-group flex-1">
              <label for="reg-password" class="form-label" id="label-reg-password">Password</label>
              <div class="input-container">
                <input 
                  type="password" 
                  id="reg-password" 
                  class="form-input" 
                  placeholder="Min 6 characters" 
                  minlength="6"
                  required
                >
                <button type="button" class="btn-toggle-password" id="btn-toggle-reg-pass" aria-label="Toggle password">
                  <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
            <div class="form-group flex-1">
              <label for="reg-confirm-password" class="form-label" id="label-reg-confirmpass">Confirm Password</label>
              <div class="input-container">
                <input 
                  type="password" 
                  id="reg-confirm-password" 
                  class="form-input" 
                  placeholder="Repeat password" 
                  minlength="6"
                  required
                >
                <button type="button" class="btn-toggle-password" id="btn-toggle-reg-confirm" aria-label="Toggle confirm password">
                  <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Anti-Bot Security Protection (Invisible Honeypot & Timestamp) -->
          <input type="text" name="website_hp" id="reg-website-hp" class="hp-input" tabindex="-1" autocomplete="off" aria-hidden="true" style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none;">
          <input type="hidden" name="formRenderTime" id="form-render-time" value="">

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-submit" id="btn-register-submit">
            <span class="btn-text" id="text-btn-register">REGISTER NOW</span>
          </button>

          <!-- Back to Sign In Link -->
          <div class="auth-bottom-switch">
            <span id="text-already-account">Already have an account?</span>
            <a href="index.html" class="switch-link-redirect" id="link-redirect-login">Sign In</a>
          </div>

        </form>

      </section>

    </main>

  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="api-config.js"></script>
  <script src="lang.js"></script>
  <script src="register.js"></script>
</body>
</html>
